name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      compose: ${{ steps.filter.outputs.compose }}
      docs: ${{ steps.filter.outputs.docs }}
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - uses: actions/checkout@v5
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - 'backend/**'
              - 'Makefile'
              - '.github/workflows/ci.yml'
            compose:
              - 'backend/**'
              - 'frontend/**'
              - 'deploy/**'
              - 'docker-compose.yml'
              - 'config/**'
              - '.github/workflows/ci.yml'
            docs:
              - 'docs/**'
            frontend:
              - 'frontend/**'
              - '.github/workflows/ci.yml'

  backend:
    needs: changes
    if: needs.changes.outputs.backend == 'true' || needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: build embedded web UI
        run: |
          cd ../frontend
          npm ci
          npm run build
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.x'
      - name: gofmt check
        run: |
          files=$(gofmt -l .)
          [ -z "$files" ] || { echo "gofmt needed: $files"; exit 1; }
      - name: go vet
        run: go vet ./...
      - name: staticcheck
        run: go run honnef.co/go/tools/cmd/staticcheck@latest ./...
      - name: unit tests
        run: go test -race -count=1 ./...

  frontend:
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: lint
        run: npm run lint
      - name: typecheck + build
        run: npm run build

  security:
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.x'
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...
      - name: gosec
        run: go run github.com/securego/gosec/v2/cmd/gosec@latest -quiet -severity medium ./...
      - name: dependency pinning check
        run: |
          if grep -nE '(master|latest|HEAD)' go.mod; then
            echo "go.mod references a moving ref — pin versions instead"; exit 1
          fi

  compose-smoke:
    needs: changes
    if: needs.changes.outputs.compose == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Build and start the stack
        run: docker compose up -d --build
      - name: Wait for readiness
        run: |
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:8080/ready; then
              echo; echo "ready after $((i*2))s"; exit 0
            fi
            sleep 2
          done
          echo "syslogq never became ready"
          docker compose ps
          docker compose logs
          exit 1
      - name: Send syslog over UDP and TCP
        run: |
          marker="smoke-$(date +%s)"
          echo "MARKER=$marker" >> "$GITHUB_ENV"
          logger -n 127.0.0.1 -P 514 --udp "$marker udp compose smoke"
          logger -n 127.0.0.1 -P 514 --tcp "$marker tcp compose smoke"
      - name: Verify web UI is served
        run: |
          html=$(curl -fsS http://localhost:8080/)
          echo "$html" | grep -q '<title>syslogq</title>' \
            || { echo "SPA not served at /"; exit 1; }
          echo "embedded UI served"
      - name: Verify messages stored (pipeline metrics)
        run: |
          for i in $(seq 1 30); do
            # || true: grep exits 1 while the counter has no children yet
            # (before the first batch flush), which must not kill the loop.
            out=$(curl -fsS http://localhost:8080/metrics | grep '^syslogq_messages_stored_total' || true)
            echo "$out"
            udp=$(echo "$out" | grep 'source="syslog-udp-5140"' | awk '{print ($2+0)}')
            tcp=$(echo "$out" | grep 'source="syslog-tcp-5140"' | awk '{print ($2+0)}')
            if [ "${udp:-0}" -ge 1 ] && [ "${tcp:-0}" -ge 1 ]; then
              echo "stored: udp=$udp tcp=$tcp"; exit 0
            fi
            sleep 1
          done
          echo "messages never reported stored"
          docker compose logs syslogq
          exit 1
      - name: Verify messages queryable in VictoriaLogs
        run: |
          for i in $(seq 1 30); do
            hits=$(curl -fsS --get 'http://127.0.0.1:9428/select/logsql/query' \
                --data-urlencode "query=~\"$MARKER\"" 2>/dev/null | grep -c "$MARKER" || true)
            if [ "${hits:-0}" -ge 2 ]; then
              echo "found $hits log entries in VictoriaLogs"; exit 0
            fi
            sleep 1
          done
          echo "messages never appeared in VictoriaLogs"
          docker compose logs
          exit 1
      - name: Stack logs on failure
        if: failure()
        run: docker compose logs

  docs:
    needs: changes
    if: needs.changes.outputs.docs == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: check internal doc links resolve
        run: |
          set -euo pipefail
          broken=0
          while IFS= read -r -d '' f; do
            while IFS= read -r link; do
              [ -z "$link" ] && continue
              if [ ! -e "docs/$link" ]; then
                echo "broken link in $f: $link"
                broken=1
              fi
            done < <(grep -oE '\]\([^)]+\)' "$f" | sed -E 's/^\]\(//; s/\)$//' \
              | grep -Ev '^(https?:|#|mailto:)' | sed -E 's/#.*$//')
          done < <(find docs -name '*.md' -print0)
          exit $broken
      - name: check ADR references resolve
        run: |
          set -euo pipefail
          missing=0
          for n in $(grep -rhoE 'ADR-[0-9]{4}' docs | grep -oE '[0-9]{4}' | sort -u); do
            if ! ls docs/decisions/"$n"-*.md >/dev/null 2>&1; then
              echo "referenced ADR-$n has no file in docs/decisions/"
              missing=1
            fi
          done
          exit $missing
      - name: validate OpenAPI document
        run: npx -y @apidevtools/swagger-cli@4 validate docs/openapi.yaml
