name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      docs: ${{ steps.filter.outputs.docs }}
    steps:
      - uses: actions/checkout@v5
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - 'backend/**'
              - 'Makefile'
              - '.github/workflows/ci.yml'
            docs:
              - 'docs/**'

  backend:
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
      - name: gofmt check
        run: |
          files=$(gofmt -l .)
          [ -z "$files" ] || { echo "gofmt needed: $files"; exit 1; }
      - name: go vet
        run: go vet ./...
      - name: staticcheck
        run: go run honnef.co/go/tools/cmd/staticcheck@latest ./...
      - name: unit tests
        run: go test -race -count=1 ./...

  security:
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...
      - name: gosec
        run: go run github.com/securego/gosec/v2/cmd/gosec@latest -quiet -severity medium ./...
      - name: dependency pinning check
        run: |
          if grep -nE '(master|latest|HEAD)' go.mod; then
            echo "go.mod references a moving ref — pin versions instead"; exit 1
          fi

  docs:
    needs: changes
    if: needs.changes.outputs.docs == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: check internal doc links resolve
        run: |
          set -euo pipefail
          broken=0
          while IFS= read -r -d '' f; do
            while IFS= read -r link; do
              [ -z "$link" ] && continue
              if [ ! -e "docs/$link" ]; then
                echo "broken link in $f: $link"
                broken=1
              fi
            done < <(grep -oE '\]\([^)]+\)' "$f" | sed -E 's/^\]\(//; s/\)$//' \
              | grep -Ev '^(https?:|#|mailto:)' | sed -E 's/#.*$//')
          done < <(find docs -name '*.md' -print0)
          exit $broken
      - name: check ADR references resolve
        run: |
          set -euo pipefail
          missing=0
          for n in $(grep -rhoE 'ADR-[0-9]{4}' docs | grep -oE '[0-9]{4}' | sort -u); do
            if ! ls docs/decisions/"$n"-*.md >/dev/null 2>&1; then
              echo "referenced ADR-$n has no file in docs/decisions/"
              missing=1
            fi
          done
          exit $missing
